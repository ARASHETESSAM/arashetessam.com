<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ARASH ETESSAM</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #ffffff;
            --text-muted: #666666;
            --card-bg: rgba(255, 255, 255, 0.02);
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--accent-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient background glow */
        body::before {
            content: '';
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(255,255,255,0.015) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .profile-container {
            display: flex;
            width: 90%;
            max-width: 850px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* Left side: Information and Links */
        .info-side {
            flex: 1.2;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: left;
        }

        .brand-title {
            font-size: 28px;
            letter-spacing: 5px;
            font-weight: 300;
            color: #fff;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        /* Links styling */
        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .social-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1px;
            transition: all 0.4s ease;
        }

        .social-link:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,255,255,0.08);
        }

        .social-link .icon-label {
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--text-muted);
            transition: color 0.4s ease;
        }

        .social-link:hover .icon-label {
            color: #333;
        }

        /* Right side: Your Image */
        .image-side {
            flex: 1;
            min-height: 480px;
            background: url('./Copy.png') no-repeat center;
            background-size: cover;
            position: relative;
        }

        .image-side::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to left, var(--bg-color) 0%, rgba(0,0,0,0) 20%);
        }

        .footer-text {
            margin-top: 40px;
            font-size: 9px;
            color: #444;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Responsive Mobile Layout */
        @media (max-width: 768px) {
            .profile-container {
                flex-direction: column-reverse;
                max-width: 400px;
                margin: 20px;
            }
            .image-side {
                min-height: 250px;
            }
            .image-side::after {
                background: linear-gradient(to bottom, var(--bg-color) 0%, rgba(0,0,0,0) 30%);
            }
            .info-side {
                padding: 35px 25px;
            }
        }
    </style>
</head>
<body>

    <div class="profile-container">
        
        <div class="info-side">
            <h1 class="brand-title">ΛRΛSH ΞTΞSSΛM</h1>
            <p class="brand-subtitle">Personal Workspace</p>

            <div class="links-wrapper">
                <a href="https://www.instagram.com/arashetessam" target="_blank" rel="noopener noreferrer" class="social-link">
                    <span class="icon-label">Instagram</span>
                    <span>@ARASHETESSAM</span>
                </a>

                <a href="mailto:info@arashetessam.com" class="social-link">
                    <span class="icon-label">Email</span>
                    <span>info@arashetessam.com</span>
                </a>
            </div>

            <div class="footer-text">
                © 2026 ARASH ETESSAM. ALL RIGHTS RESERVED.
            </div>
        </div>

        <div class="image-side"></div>

    </div>

</body>
</html>
