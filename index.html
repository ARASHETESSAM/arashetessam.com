<!doctype html>

<head>
    <meta charset="utf-8" />

    <title>ARASH ETESSAM</title>
    <link rel="icon" type="image/png" href="/favicon.png" />

    <style>
        :root {
            --bg-color: #0a0a0a;
            --accent-color: #ffffff;
            --text-muted: #666666;
            --border-color: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--accent-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .workspace-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
        }

        /* سمت چپ: تصویر اصلی شما بدون کات شدن */
        .image-side {
            flex: 1;
            background: #000 url('./Copy.png') no-repeat center left;
            background-size: contain;
            position: relative;
        }

        /* لایه فید ملایم برای ادغام لبه سمت راست تصویر با پس‌زمینه تیره */
        .image-side::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 150px;
            height: 100%;
            background: linear-gradient(to left, rgba(10, 10, 10, 0) 0%, var(--bg-color) 100%);
            pointer-events: none;
        }

        /* سمت راست: بخش اطلاعات و سوشال مدیا همرنگ صفحه */
        .info-side {
            width: 450px;
            background-color: var(--bg-color);
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 10;
        }

        .brand-title {
            font-size: 26px;
            letter-spacing: 5px;
            font-weight: 300;
            color: #fff;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--border-color);
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .social-link:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
            transform: translateY(-2px);
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* استایل آیکون‌های SVG مینی‌مال */
        .social-icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }

        .social-link:hover .social-icon {
            opacity: 1;
        }

        .icon-label {
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--text-muted);
        }

        .social-link:hover .icon-label {
            color: #444;
        }

        .footer-text {
            margin-top: 40px;
            font-size: 9px;
            color: #333;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* بهینه‌سازی کامل برای موبایل */
        @media (max-width: 900px) {
            .workspace-container {
                flex-direction: column-reverse;
            }
            .image-side {
                flex: 1;
                background-position: center;
            }
            .image-side::after {
                width: 100%;
                height: 100px;
                top: 0;
                background: linear-gradient(to top, rgba(10, 10, 10, 0) 0%, var(--bg-color) 100%);
            }
            .info-side {
                width: 100%;
                padding: 40px 30px;
            }
        }
    </style>
</head>
