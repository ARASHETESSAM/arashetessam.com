<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | ARASH ETESSAM</title>
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #ffffff;
            --text-muted: #666666;
            --glow-color: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--accent-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* پس‌زمینه رمزآلود */
        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,255,255,0.015) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }

        .login-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            text-align: center;
        }

        /* بخش لوگو و اثر انگشت */
        .brand-section {
            margin-bottom: 40px;
            position: relative;
        }

        .fingerprint-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-3M12 15V9M8 21a6 6 0 0 1-2.4-4.8M16 21a6 6 0 0 0 2.4-4.8M5.1 11.2a9 9 0 0 1 2.3-5.2M18.9 11.2a9 9 0 0 0-2.3-5.2M9 3.5a12 12 0 0 1 6 0"/></svg>') no-repeat center;
            background-size: contain;
            opacity: 0.7;
            cursor: pointer;
            transition: all 0.5s ease;
            filter: drop-shadow(0 0 0px var(--accent-color));
            animation: pulseGlow 3s infinite ease-in-out;
        }

        .fingerprint-icon:hover {
            opacity: 1;
            transform: scale(1.05);
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.3));
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.85; filter: drop-shadow(0 0 4px rgba(255,255,255,0.1)); }
        }

        .logo-text {
            font-size: 24px;
            letter-spacing: 6px;
            font-weight: 300;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 5px;
        }
        
        /* شبیه‌سازی فونت تصویر شما لاندایی شکل */
        .logo-text span {
            font-family: monospace;
            font-weight: 200;
        }

        .logo-subtext {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* فرم ورود */
        .input-group {
            position: relative;
            margin-bottom: 25px;
            text-align: right;
        }

        .input-group input {
            width: 100%;
            padding: 12px 10px;
            background: transparent;
            border: none;
            border-bottom: 1px solid #222;
            color: #fff;
            font-size: 14px;
            letter-spacing: 1px;
            outline: none;
            transition: border-color 0.4s ease;
            direction: ltr;
        }

        .input-group input:focus {
            border-bottom-color: var(--accent-color);
        }

        .input-group label {
            position: absolute;
            top: 12px;
            right: 10px;
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        /* افکت شناور شدن لیبل‌ها هنگام فوکوس */
        .input-group input:focus ~ label,
        .input-group input:valid ~ label {
            top: -12px;
            right: 0;
            font-size: 10px;
            color: var(--accent-color);
        }

        /* دکمه ورود */
        .login-btn {
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 1px solid #333;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 400;
            margin-top: 15px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        .login-btn:hover {
            border-color: var(--accent-color);
            background: #fff;
            color: #000;
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }

        /* فوتر صفحه */
        .footer-text {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            font-size: 9px;
            color: #333;
            letter-spacing: 2px;
            text-align: center;
        }

        .utilities {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 11px;
        }

        .utilities a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .utilities a:hover {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="login-container">
        
        <div class="brand-section">
            <div class="fingerprint-icon" title="اسکن بیومتریک"></div>
            <div class="logo-text">ΛRΛSH ΞTΞSSΛM</div>
            <div class="logo-subtext">Identity Verification</div>
        </div>

        <form action="#" method="POST" autocomplete="off">
            <div class="input-group">
                <input type="email" required>
                <label>EMAIL / نام کاربری</label>
            </div>
            
            <div class="input-group">
                <input type="password" required>
                <label>PASSWORD / رمز عبور</label>
            </div>

            <button type="submit" class="login-btn">ENTER / ورود</button>

            <div class="utilities">
                <a href="#">رمز عبور را فراموش کرده‌اید؟</a>
                <a href="#">ΛΞ</a>
            </div>
        </form>

    </div>

    <div class="footer-text">
        © 2026 ARASH ETESSAM. ALL RIGHTS RESERVED.
    </div>

</body>
</html>
